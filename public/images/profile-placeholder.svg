<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Placeholder portrait. Replace with your own photo: see src/data/content.js -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14213A"/>
      <stop offset="0.55" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="halo" cx="400" cy="400" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="300" y1="260" x2="520" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334766"/>
      <stop offset="1" stop-color="#1B2840"/>
    </linearGradient>
    <linearGradient id="coat" x1="400" y1="620" x2="400" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9D6EA"/>
      <stop offset="1" stop-color="#7F92B2"/>
    </linearGradient>
    <linearGradient id="shirt" x1="400" y1="620" x2="400" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A6E"/>
      <stop offset="1" stop-color="#132447"/>
    </linearGradient>
    <linearGradient id="rim" x1="250" y1="200" x2="560" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <circle cx="400" cy="400" r="420" fill="url(#halo)"/>
  <circle cx="400" cy="420" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <circle cx="400" cy="420" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 9"/>

  <!-- Shoulders: shirt + white coat -->
  <path d="M110 1000 C 120 820, 220 720, 400 700 C 580 720, 680 820, 690 1000 Z" fill="url(#shirt)"/>
  <path d="M110 1000 C 118 830, 210 735, 340 708 L 400 860 L 380 1000 Z" fill="url(#coat)"/>
  <path d="M690 1000 C 682 830, 590 735, 460 708 L 400 860 L 420 1000 Z" fill="url(#coat)"/>
  <path d="M340 708 L 400 860 L 460 708" fill="none" stroke="#0B1222" stroke-opacity="0.35" stroke-width="3"/>
  <!-- Coat pocket -->
  <rect x="505" y="860" width="84" height="12" rx="4" fill="#0B1222" fill-opacity="0.18"/>

  <!-- Neck & head -->
  <path d="M345 560 L 345 700 Q 400 745 455 700 L 455 560 Z" fill="url(#skin)"/>
  <ellipse cx="400" cy="430" rx="138" ry="160" fill="url(#skin)"/>
  <ellipse cx="400" cy="430" rx="138" ry="160" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Stethoscope -->
  <g fill="none" stroke="#0F172A" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round">
    <path d="M318 712 C 300 790, 318 860, 360 900"/>
    <path d="M482 712 C 500 790, 482 860, 440 900"/>
    <path d="M360 900 C 380 930, 420 930, 440 900"/>
  </g>
  <path d="M400 926 L 400 960" stroke="#0F172A" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round"/>
  <circle cx="400" cy="972" r="22" fill="#1E293B" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="400" cy="972" r="9" fill="#38BDF8" fill-opacity="0.7"/>

  <!-- Soft vignette -->
  <rect width="800" height="1000" fill="url(#bg)" fill-opacity="0.12"/>
</svg>
